version: 2

project_name: indexit

archives:
  - id: indexit
    files:
      - LICENSE
      - skills/indexit/**
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

# brews is deprecated upstream, but supplies the Formula service DSL needed
# for one package managed by brew services. Keep GoReleaser pinned in CI.
brews:
  - name: indexit
    ids: [indexit]
    skip_upload: auto
    commit_author:
      use_github_app_token: true
    description: CLI for indexing personal data.
    license: MIT
    directory: Formula
    homepage: https://github.com/octopot/indexit
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    install: |
      bin.install "indexit"
      generate_completions_from_executable(bin/"indexit", "completion")
    service: |
      run macos: [opt_bin/"indexit", "service", "run"]
      keep_alive true
      working_dir Dir.home
      log_path var/"log/indexit.log"
      error_log_path var/"log/indexit.log"
    caveats: |
      Start the image service as your normal user:
        brew services start octolab/tap/indexit
      It answers at http://indexit.localhost:17840/ on loopback, without sudo.
      Photographs and configuration survive upgrades and uninstall.
    test: |
      system "#{bin}/indexit", "version"
      system "#{bin}/indexit", "service", "run", "--help"

builds:
  - id: indexit
    binary: indexit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: .

checksum: { name_template: checksums.txt }

release:
  # the repository comes from the git remote; the title from the release note,
  # see .github/scripts/release.mjs render
  name_template: '{{ envOrDefault "RELEASE_TITLE" .Tag }}'
  # a prerelease tag (vX.Y.Z-rcN) is published as a prerelease, never as Latest
  prerelease: auto
  preflight:
    fail_on_error: true
