version: 2

project_name: indexit

archives:
  - id: indexit
    files:
      - LICENSE
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

homebrew_casks:
  - name: indexit
    ids: [indexit]
    binaries: [indexit]
    commit_author:
      name: Kamil Samigullin
      email: kamil@samigullin.info
    description: CLI for indexing personal data.
    directory: Casks
    homepage: https://github.com/octopot/indexit
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    generate_completions_from_executable:
      executable: indexit
      shell_parameter_format: cobra
      shells: [bash, zsh, fish]

builds:
  - id: indexit
    binary: indexit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: .

checksum: { name_template: checksums.txt }

release:
  # the repository comes from the git remote; the title from the release note,
  # see .github/scripts/release.mjs render
  name_template: '{{ envOrDefault "RELEASE_TITLE" .Tag }}'
  preflight:
    fail_on_error: true
