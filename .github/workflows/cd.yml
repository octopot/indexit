name: Continuous delivery

on:
  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  release:
    name: Releasing
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      # seconds-level safety net for bypassed local hooks, before any build
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/release.mjs check "${GITHUB_REF_NAME}"
      - name: Check release secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: node .github/scripts/release.mjs preflight
      - name: Set up GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Check the Pages domain
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node .github/scripts/release.mjs pages "${BASE_URL}"
      - name: Render the release note
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          title="$(node .github/scripts/release.mjs render "${GITHUB_REF_NAME}" --site-url "${SITE_URL}" --out "${notes}")"
          echo "RELEASE_TITLE=${title}" >> "${GITHUB_ENV}"
          echo "RELEASE_NOTES=--release-notes ${notes}" >> "${GITHUB_ENV}"

      - name: Set up Go environment
        id: go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x
          cache: false
          check-latest: true
      # setup-go restores only on an exact key, so any go.sum change meant a
      # cold cross-compile of gotd (~5GB per target); fall back to a stale cache
      - name: Restore the release build cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: |
            release-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-
            release-${{ runner.os }}-
      - name: Limit build parallelism on a cold cache
        if: steps.cache.outputs.cache-matched-key == ''
        run: echo "BUILD_FLAGS=--parallelism 2" >> "${GITHUB_ENV}"

      - name: Install tools for release checks
        run: make tools
      - name: Run fast check and tests
        run: make fast-check test TIMEOUT=2m
      - name: Publish the release
        uses: goreleaser/goreleaser-action@v7.2.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        with:
          distribution: goreleaser
          version: v2.18.2
          # a cold build of gotd needs ~5GB per target, so four in parallel
          # overrun the 16GB runner; a warm cache needs ~0.6GB — see BUILD_FLAGS
          args: ${{ startsWith(github.ref, 'refs/tags/v') && format('release --clean {0} {1}', env.BUILD_FLAGS, env.RELEASE_NOTES) || format('release --snapshot --clean --skip=publish {0}', env.BUILD_FLAGS) }}
      - name: Save the release build cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  notify:
    name: Notifying
    needs: [ release ]
    runs-on: ubuntu-24.04
    if: failure() || success()

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - name: Send notification
        uses: ./.github/actions/notify
        with:
          emoji: 🚀
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}
