name: Repository doctor

on:
  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

permissions:
  contents: read

jobs:
  doctor:
    name: Diagnosing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      # the workflow token cannot list secrets: they are reported as unverified,
      # the preflight below checks the ones that matter for a release
      - name: Compare the repository with GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/release.mjs doctor
      - name: Check release secrets
        if: success() || failure()
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: node .github/scripts/release.mjs preflight
