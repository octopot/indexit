name: Continuous integration

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - '.golangci.yml'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Taskfile'

  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - '.golangci.yml'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Taskfile'
    tags: [ 'v*' ]

  schedule:
    - cron: 0 7 1 * * # at 07:00 on day-of-month 1, UTC

  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true

      - name: Run linter
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          args: --fast-only

  vulns:
    name: Checking vulnerabilities
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: |
            go.sum
            tools/go.sum
          check-latest: true

      # the same gate as fast-check in cd.yml
      - name: Check dependencies
        run: make tools go-deps-check

  test:
    name: Testing
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.x
          - 1.27.x

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '${{ matrix.go }}'
          check-latest: true
      - name: Set up environment
        run: make env deps

      - name: Run fast check source code
        run: make go-check
      # cd.yml runs fast-check on a tag: an untidy go.mod must fail here first
      - name: Check that modules are tidy
        run: make go-deps-tidy git-check
      - name: Run tests
        run: make test TIMEOUT=2m
        if: matrix.go != '1.27.x'
      - name: Run tests with coverage report
        run: make test-with-coverage TIMEOUT=2m
        if: matrix.go == '1.27.x'
      - name: Store code coverage report
        uses: actions/upload-artifact@v7.0.1
        with: { name: code-coverage-report, path: c.out, if-no-files-found: error }
        if: matrix.go == '1.27.x'

      - name: Check installation
        run: |
          make install
          [ "$(find bin/linux -mindepth 2 -type f | wc -l)" = 1 ]

  report:
    name: Reporting
    permissions:
      contents: read
      id-token: write
    needs: [ test ]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: Fetch code coverage report
        uses: actions/download-artifact@v8.0.1
        with: { name: code-coverage-report }
      - name: Send code coverage report to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: c.out
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

  notify:
    name: Notifying
    needs: [ lint, report, vulns ]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
      && (failure() || success())

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - name: Send notification
        uses: ./.github/actions/notify
        with:
          emoji: ⚙️
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}
