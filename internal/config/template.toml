# indexit configuration, read by the CLI and by `indexit service run`.
# `indexit service run` wrote this file because there was none; it never
# changes it again. Every key is optional: a commented key keeps its default,
# an unknown key is an error. Reference:
# https://indexit.octolab.org/guide/local-images/

[service]
# Scheme, host and optional port of the photograph URLs written into exports.
# Exports keep the origin they were written with.
# origin = "http://indexit.localhost:17840"

# The statistics page at http://indexit.localhost:17840/. false leaves / a
# plain-text health line. On by default for a local origin, off for another:
# a proxy in front of the service would expose the page.
# dashboard = true

# The directory of the saved photographs: an absolute path or one starting with
# ~/. A folder shared with another computer, such as one in Google Drive, shows
# the same photographs there by the same URLs. Default: images in the data
# directory, ~/.local/share/indexit/images.
# images = "~/Google Drive/indexit/images"
